services:
  # ==================== 1. MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ==================== 2. Redis 7.x ====================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ==================== 3. Kafka 4.2 (KRaft, 无 Zookeeper) ====================
  kafka:
    image: apache/kafka:4.2.0
    container_name: rag-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - rag-network

  # ==================== 4. MinIO 对象存储 ====================
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network

  # ==================== 5. MinIO 初始化 (创建 bucket) ====================
  minio-init:
    image: minio/mc:latest
    container_name: rag-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/${MINIO_BUCKET:-rag-documents};
      mc anonymous set download local/${MINIO_BUCKET:-rag-documents};
      echo 'MinIO bucket ${MINIO_BUCKET:-rag-documents} ready';
      "
    networks:
      - rag-network

  # ==================== 6. Milvus 向量数据库 (etcd + standalone) ====================
  etcd:
    image: quay.io/coreos/etcd:v3.6.11
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.16
    container_name: rag-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: milvus run standalone
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== 7. Python AI 服务 (gRPC :50051 + :50052 + Kafka) ====================
  rag-python:
    build:
      context: ../RAG-PYTHON
      dockerfile: docker/Dockerfile
    image: rag-python:latest
    container_name: rag-python
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "${GRPC_RETRIEVAL_PORT:-50051}:50051"
      - "${GRPC_GENERATION_PORT:-50052}:50052"
    environment:
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # Milvus
      MILVUS_HOST: milvus
      # Redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # LLM
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Cleaning service endpoint
      CLEANING_GRPC_ENDPOINT: rag-cleaning:50056
      # HuggingFace Mirror (for downloading embedding model)
      HF_ENDPOINT: https://hf-mirror.com
      TZ: Asia/Shanghai
    volumes:
      - ../RAG-PYTHON/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network

  # ==================== 8. Java 应用 ====================
  rag-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rag-server:latest
    container_name: rag-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rag-python:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # MySQL (覆盖 application.yml 中的 localhost 默认值)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rag_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # gRPC (Python AI 服务)
      GRPC_RETRIEVAL_HOST: rag-python
      GRPC_RETRIEVAL_PORT: 50051
      GRPC_GENERATION_HOST: rag-python
      GRPC_GENERATION_PORT: 50052
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      # JVM
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Duser.timezone=Asia/Shanghai"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rag-network

  # ==================== 9. RAG-MEMORY 记忆管理服务 (gRPC :50053 + :50054 + Kafka) ====================
  rag-memory:
    build:
      context: ../RAG-MEMORY
      dockerfile: Dockerfile
    image: rag-memory:latest
    container_name: rag-memory
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GRPC_MEMORY_WRITE_PORT:-50053}:50053"
      - "${GRPC_MEMORY_SEARCH_PORT:-50054}:50054"
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_db}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # LLM
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    volumes:
      - ../RAG-MEMORY/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50053'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

  # ==================== 10. QUE Engine 查询理解与执行引擎 (gRPC :50055) ====================
  que-engine:
    build:
      context: ../RAG-QUE
      dockerfile: Dockerfile
    image: rag-que:latest
    container_name: rag-que
    restart: unless-stopped
    depends_on:
      rag-python:
        condition: service_healthy
      rag-memory:
        condition: service_healthy
    ports:
      - "${GRPC_QUE_PORT:-50055}:50055"
    environment:
      # gRPC clients
      GRPC_RETRIEVAL_HOST: rag-python
      GRPC_RETRIEVAL_PORT: 50051
      GRPC_MEMORY_HOST: rag-memory
      GRPC_MEMORY_SEARCH_PORT: 50054
      # LLM
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    volumes:
      - ../RAG-QUE/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50055'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

  # ==================== 11. RAG-CLEANING 文档清洗服务 (gRPC :50056 + Kafka) ====================
  rag-cleaning:
    build:
      context: ../RAG-CLEANING
      dockerfile: docker/Dockerfile
    image: rag-cleaning:latest
    container_name: rag-cleaning
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GRPC_CLEANING_PORT:-50056}:50056"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    volumes:
      - ../RAG-CLEANING/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50056'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

# ==================== 卷 ====================
volumes:
  mysql_data:
    name: rag-mysql-data
  redis_data:
    name: rag-redis-data
  kafka_data:
    name: rag-kafka-data
  minio_data:
    name: rag-minio-data
  etcd_data:
    name: rag-etcd-data
  milvus_data:
    name: rag-milvus-data

# ==================== 网络 ====================
networks:
  rag-network:
    name: rag-network
    driver: bridge
