version: "3.8"

services:
  # ==================== 1. MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ==================== 2. Redis 7.x ====================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ==================== 3. Kafka 3.6 (KRaft, 无 Zookeeper) ====================
  kafka:
    image: bitnami/kafka:3.6
    container_name: rag-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - rag-network

  # ==================== 4. MinIO 对象存储 ====================
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network

  # ==================== 5. MinIO 初始化 (创建 bucket) ====================
  minio-init:
    image: minio/mc:latest
    container_name: rag-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/${MINIO_BUCKET:-rag-documents};
      mc anonymous set download local/${MINIO_BUCKET:-rag-documents};
      echo 'MinIO bucket ${MINIO_BUCKET:-rag-documents} ready';
      "
    networks:
      - rag-network

  # ==================== 6. Python AI 检索服务 (gRPC :50051) ====================
  # 代码由 AI 团队维护，需在 ai-services/retrieval/ 目录下提供 retrieval_server.py
  rag-retrieval:
    build:
      context: .
      dockerfile: docker/Dockerfile.retrieval
    image: rag-retrieval:latest
    container_name: rag-retrieval
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${GRPC_RETRIEVAL_PORT:-50051}:50051"
    volumes:
      - ./ai-services/retrieval:/app/retrieval
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

  # ==================== 7. Python AI 生成服务 (gRPC :50052) ====================
  # 代码由 AI 团队维护，需在 ai-services/generation/ 目录下提供 generation_server.py
  rag-generation:
    build:
      context: .
      dockerfile: docker/Dockerfile.generation
    image: rag-generation:latest
    container_name: rag-generation
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${GRPC_GENERATION_PORT:-50052}:50052"
    volumes:
      - ./ai-services/generation:/app/generation
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50052'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

  # ==================== 8. Java 应用 ====================
  rag-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rag-server:latest
    container_name: rag-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rag-retrieval:
        condition: service_healthy
      rag-generation:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # MySQL (覆盖 application.yml 中的 localhost 默认值)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rag_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # gRPC (Python AI 服务 — 外部部署)
      GRPC_RETRIEVAL_HOST: ${GRPC_RETRIEVAL_HOST:-rag-python-retrieval}
      GRPC_RETRIEVAL_PORT: ${GRPC_RETRIEVAL_PORT:-50051}
      GRPC_GENERATION_HOST: ${GRPC_GENERATION_HOST:-rag-python-generation}
      GRPC_GENERATION_PORT: ${GRPC_GENERATION_PORT:-50052}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      # JVM
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rag-network

# ==================== 卷 ====================
volumes:
  mysql_data:
    name: rag-mysql-data
  redis_data:
    name: rag-redis-data
  kafka_data:
    name: rag-kafka-data
  minio_data:
    name: rag-minio-data

# ==================== 网络 ====================
networks:
  rag-network:
    name: rag-network
    driver: bridge
